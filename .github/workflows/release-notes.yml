# Release notes for league commissioners (Dan, 2026-11-20). When a PGG Caddie
# release is published here, send its version and notes to pggtour.com's
# release-notes-sync function, which writes a note for every league's Admin,
# What's new (tagged PGG Caddie). The function checks this run's GitHub OIDC
# token, so there's no secret here. Run it by hand (Actions, Release notes,
# Run workflow) to note an earlier release; each version is noted once.
name: Release notes

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to note (e.g. v1.0.9)
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - name: Send the release to release-notes-sync
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh api "repos/$REPO/releases/tags/$TAG" > release.json
          jq '{kind: "caddie", version: .tag_name, notes: (.body // ""), published_at: .published_at}' release.json > note.json
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pggtour-release-notes" | jq -r .value)
          curl -sS --fail-with-body -X POST "https://hqnorjqpiydsfaudrrkg.supabase.co/functions/v1/release-notes-sync" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @note.json
